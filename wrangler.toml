# Deploy config for the aporganics.online website + its Yoco payment backend.
#
# The site is hosted as a Cloudflare Worker using Workers Static Assets, and the
# same Worker runs the Yoco Checkout API (worker/src/index.js) so the secret key
# never reaches the browser. The Worker name below MUST match the existing Worker
# that the aporganics.online Custom Domain is attached to, otherwise this would
# create a brand-new Worker and the live domain would keep serving the old one.
name = "round-rain-b4e8"
main = "worker/src/index.js"
compatibility_date = "2026-10-13"

# Static files in this folder are served as assets. `run_worker_first` sends only
# /api/* to the script; every other path is served straight from the assets, so
# the storefront is unaffected. Files in .assetsignore are skipped (worker/,
# tests/, tools/, landing/ ...).
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Non-secret configuration for the payment API. The Yoco SECRET KEY is NOT here —
# store it as a Worker secret (run from this folder):
#   npx wrangler secret put YOCO_SECRET_KEY        # sk_test_... or sk_live_...
#   npx wrangler secret put YOCO_WEBHOOK_SECRET    # whsec_... (optional)
[vars]
SITE_URL = "https://aporganics.online"
ALLOWED_ORIGINS = "https://aporganics.online,https://www.aporganics.online,http://localhost:8001,http://localhost:8002"
DELIVERY_FEE_CENTS = "0"

[observability]
enabled = true

# NOTE: do NOT add a [routes] block here. The aporganics.online Custom Domain
# is attached to this Worker in the Cloudflare dashboard and is preserved across
# deploys; adding a conflicting route can break it.
