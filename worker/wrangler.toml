name = "aporganics-yoco"
main = "src/index.js"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------- vars
# Non-secret configuration. The SECRET KEY belongs in a Worker secret, not here
# (see README). The value below is Yoco's PUBLIC test key so the integration
# works in sandbox out of the box — replace it with your own sk_live_... secret
# via `wrangler secret put YOCO_SECRET_KEY` before going live.
[vars]
SITE_URL = "https://aporganics.online"
ALLOWED_ORIGINS = "https://aporganics.online,https://www.aporganics.online,http://localhost:8001,http://localhost:8002"
DELIVERY_FEE_CENTS = "0"
# YOCO_SECRET_KEY must NOT be committed — set it with:
#   wrangler secret put YOCO_SECRET_KEY
#   wrangler secret put YOCO_WEBHOOK_SECRET

# Public route the storefront calls. Point a DNS record or a Worker route at it.
[routes]
# e.g. pattern = "aporganics.online/api/*", zone_name = "aporganics.online"

[observability]
enabled = true
